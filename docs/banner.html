<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Z2 Web SDR banner</title>
<!-- Renders the social preview and README banners. ?w=1280&h=640 (social) or ?w=1280&h=320 (README).
     Render: chrome --headless=new --hide-scrollbars --window-size=W,H --screenshot=out.png "banner.html?w=W&h=H" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root { --bg: #0a0e11; --fg: #d6e1e5; --muted: #8a9ca5; --trace: #93d8e6; --amber: #f0a443; }
html, body { margin: 0; background: var(--bg); overflow: hidden; }
.b { position: relative; overflow: hidden; background: var(--bg); color: var(--fg); font-family: "Barlow", "Segoe UI", sans-serif; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.text { position: absolute; left: 6%; top: 50%; transform: translateY(-50%); max-width: 42%; }
h1 { margin: 0; white-space: nowrap; font: 600 var(--t1) / 0.95 "Barlow Semi Condensed", "Arial Narrow", sans-serif; letter-spacing: -0.01em; }
h1 .z { color: var(--amber); }
p { margin: 0; }
.sub { margin-top: 0.5em; font: 500 var(--t2) / 1.25 "Barlow", sans-serif; color: var(--fg); }
.det { margin-top: 0.9em; font: 400 var(--t3) / 1.4 "Barlow", sans-serif; color: var(--muted); max-width: 30em; }
.url { position: absolute; left: 6%; bottom: 7%; font: 500 var(--t4) "IBM Plex Mono", monospace; color: var(--muted); }
.mark { position: absolute; font: 500 var(--t4) "IBM Plex Mono", monospace; color: var(--amber); white-space: nowrap; }
</style>
</head>
<body>
<div class="b" id="b">
  <canvas id="c"></canvas>
  <div class="text">
    <h1><span class="z">Z2</span> Web SDR</h1>
    <p class="sub">The ESP32-S3 radio, live in your browser.</p>
    <p class="det" id="det">80 MHz of spectrum and waterfall over a plain USB cable. Open one HTML file in Chrome or Edge, plug in the board, and watch 2.4 GHz.</p>
  </div>
  <div class="url" id="url">github.com/z2labs/z2-web-sdr</div>
  <div class="mark" id="mark">2437.000 MHz</div>
</div>
<script>
const q = new URLSearchParams(location.search), W = +(q.get("w") || 1280), H = +(q.get("h") || 640);
const b = document.getElementById("b"); b.style.width = W + "px"; b.style.height = H + "px";
const wide = W / H > 3;
const t1 = wide ? H * 0.27 : H * 0.15;
b.style.setProperty("--t1", t1 + "px"); b.style.setProperty("--t2", t1 * 0.30 + "px");
b.style.setProperty("--t3", t1 * 0.22 + "px"); b.style.setProperty("--t4", Math.max(12, t1 * 0.17) + "px");
if (wide) { document.getElementById("det").style.display = "none"; document.getElementById("url").style.display = "none"; }

// Seeded random so every render is the same picture
let seed = 20261008; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const gauss = () => Math.sqrt(-2 * Math.log(rnd() || 1e-9)) * Math.cos(6.2832 * rnd());

// One spectrum of a 2397–2477 MHz scene: Wi-Fi 1/6/11, BLE hops, a narrow carrier
const F0 = 2397e6, SPAN = 80e6, WIFI = []; let BLE = [];
function spectrum(n, t) {
  const p = new Float64Array(n);
  const add = (fc, db, shape) => { for (let j = 0; j < n; j++) { const f = F0 + (j + 0.5) * SPAN / n; p[j] += Math.pow(10, (db + shape(Math.abs(f - fc))) / 10); } };
  const ofdm = (d) => d < 8.3e6 ? 0 : d < 11e6 ? -20 * (d - 8.3e6) / 2.7e6 : d < 20e6 ? -20 - 8 * (d - 11e6) / 9e6 : -40;
  // bursts last several rows, as on a real waterfall
  [[2412e6, -40, 0.10, 0.06], [2437e6, -35, 0.05, 0.12], [2462e6, -45, 0.14, 0.05]].forEach(([fc, db, pOff, pOn], i) => {
    const st = (WIFI[i] = WIFI[i] || { on: false, lvl: 0 });
    if (st.on ? rnd() < pOff : rnd() < pOn) { st.on = !st.on; st.lvl = 4 * gauss(); }
    if (st.on) add(fc, db + st.lvl + 0.8 * gauss(), ofdm);
  });
  BLE.forEach((h) => h.left--); BLE = BLE.filter((h) => h.left > 0);
  if (rnd() < 0.18) BLE.push({ f: 2402e6 + 2e6 * Math.floor(rnd() * 40), left: 2 + Math.floor(rnd() * 3) });
  for (const h of BLE) add(h.f, -50, (d) => -14 * (d / 0.7e6) ** 2);
  add(2450.5e6, -46, (d) => -60 * (d / 0.12e6) ** 2);
  const out = new Float32Array(n);
  for (let j = 0; j < n; j++) out[j] = 10 * Math.log10(p[j] + Math.pow(10, -6.6)) + 1.0 * gauss();
  return out;
}
const STOPS = [[0, 4, 6, 12], [0.2, 8, 20, 90], [0.4, 0, 110, 210], [0.56, 0, 210, 200], [0.72, 240, 225, 50], [0.86, 255, 120, 0], [1, 255, 40, 20]];
function color(u) {
  u = Math.max(0, Math.min(1, u)); let k = 0; while (k < STOPS.length - 2 && u > STOPS[k + 1][0]) k++;
  const a = STOPS[k], c = STOPS[k + 1], t = (u - a[0]) / (c[0] - a[0]);
  return [a[1] + (c[1] - a[1]) * t, a[2] + (c[2] - a[2]) * t, a[3] + (c[3] - a[3]) * t];
}

const cv = document.getElementById("c"), dpr = 2; cv.width = W * dpr; cv.height = H * dpr;
const g = cv.getContext("2d");
// The radio picture lives on the right; the left keeps a calm ground for the type
const x0 = Math.round(W * (wide ? 0.42 : 0.47) * dpr), PW = W * dpr - x0;
const specH = Math.round(H * dpr * (wide ? 0.42 : 0.36)), wfTop = specH;
const n = 512, lo = -72, hi = -22;
// waterfall
const img = g.createImageData(PW, H * dpr - wfTop);
let avg = null;
for (let y = 0; y < img.height; y++) {
  const s = spectrum(n, y * 0.5);
  if (!avg) avg = new Float64Array(n);
  for (let j = 0; j < n; j++) avg[j] += Math.pow(10, s[j] / 10) / img.height;   // mean power over the whole picture
  for (let x = 0; x < PW; x++) {
    const v = s[Math.min(n - 1, Math.floor(x / PW * n))];
    const [r, gg, bb] = color((v - lo) / (hi - lo)), i = 4 * (y * PW + x);
    img.data[i] = r; img.data[i + 1] = gg; img.data[i + 2] = bb; img.data[i + 3] = 255;
  }
}
g.putImageData(img, x0, wfTop);
// spectrum: mean power of the waterfall below it, with a soft fill
for (let j = 0; j < n; j++) avg[j] = 10 * Math.log10(avg[j]);
const yOf = (v) => specH * 0.94 - (v + 70) / 42 * specH * 0.66;
g.strokeStyle = "rgba(150,180,195,0.10)"; g.lineWidth = 1;
for (let k = 1; k < 5; k++) { const y = Math.round(specH * k / 5) + 0.5; g.beginPath(); g.moveTo(x0, y); g.lineTo(W * dpr, y); g.stroke(); }
for (let k = 1; k < 8; k++) { const x = Math.round(x0 + PW * k / 8) + 0.5; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, specH); g.stroke(); }
g.beginPath(); g.moveTo(x0, specH);
for (let x = 0; x < PW; x++) g.lineTo(x0 + x, yOf(avg[Math.floor(x / PW * n)]));
g.lineTo(W * dpr, specH); g.closePath();
const grad = g.createLinearGradient(0, 0, 0, specH); grad.addColorStop(0, "rgba(147,216,230,0.32)"); grad.addColorStop(1, "rgba(147,216,230,0.02)");
g.fillStyle = grad; g.fill();
g.beginPath();
for (let x = 0; x < PW; x++) { const y = yOf(avg[Math.floor(x / PW * n)]); x ? g.lineTo(x0 + x, y) : g.moveTo(x0, y); }
g.strokeStyle = "#93d8e6"; g.lineWidth = 1.6 * dpr; g.stroke();
g.fillStyle = "#0e1418"; g.fillRect(x0, specH - 2 * dpr, PW, 2 * dpr);
// fade the picture into the ground under the type
const fade = g.createLinearGradient(x0, 0, x0 + PW * 0.45, 0);
fade.addColorStop(0, "rgba(10,14,17,1)"); fade.addColorStop(1, "rgba(10,14,17,0)");
g.fillStyle = fade; g.fillRect(x0, 0, PW * 0.45, H * dpr);
// marker on Wi-Fi channel 6
const mx = x0 + (2437e6 - F0) / SPAN * PW;
g.strokeStyle = "#f0a443"; g.lineWidth = 1.2 * dpr; g.setLineDash([5 * dpr, 4 * dpr]);
g.beginPath(); g.moveTo(mx, 0); g.lineTo(mx, H * dpr); g.stroke(); g.setLineDash([]);
const m = document.getElementById("mark"); m.style.left = (mx / dpr + 8) + "px"; m.style.top = (specH / dpr - (wide ? 22 : 30)) + "px";
</script>
</body>
</html>
